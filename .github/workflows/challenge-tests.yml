name: Challenge regression tests
on:
  pull_request:
    paths:
      - 'server/**'
      - 'shared/**'
      - 'workers/optimizer/**'
      - 'tests/test_event*'
      - 'tests/test_layout_scoring.py'
      - 'requirements-test.txt'
      - '.github/workflows/challenge-tests.yml'
  push:
    branches: ['codex/challenge-end-to-end']
jobs:
  challenge:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: 'sqlite://'
      ASYNC_DATABASE_URL: 'sqlite+aiosqlite://'
      ENV: test
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: python -m pytest tests/test_event_api.py tests/test_event_rules.py tests/test_layout_scoring.py -q
